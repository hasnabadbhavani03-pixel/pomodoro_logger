[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pomodoro-study-session-logger"
version = "1.1.0"
description = "Local study session logger with CLI, optional dashboard, analytics and exports"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["pomodoro*"]
